name: Create Agreement PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: agreement-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-agreement-pr:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'pending-agreement')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Resolve Agreement PR target branch
        id: target
        run: node scripts/resolve-agreement-target-branch.mjs

      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        run: |
          git check-ref-format --branch "$TARGET_BRANCH"
          git rev-parse --verify "refs/remotes/origin/$TARGET_BRANCH"

      - name: Check out the target branch
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        run: git switch --detach "origin/$TARGET_BRANCH"

      - name: Validate issue and prepare registry change
        id: prepare
        run: node scripts/prepare-agreement-pr.mjs

      - name: Explain invalid signing issue
        if: steps.prepare.outputs.status == 'invalid'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MISSING: ${{ steps.prepare.outputs.missing }}
        run: >-
          gh issue comment "$ISSUE_NUMBER"
          --body "The agreement request could not be processed because these required acknowledgements were missing: ${MISSING}"

      - name: Explain existing agreement
        if: steps.prepare.outputs.status == 'already-signed'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
          GITHUB_LOGIN: ${{ steps.prepare.outputs.github_login }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "@${GITHUB_LOGIN} already has a current contributor agreement on ${TARGET_BRANCH}."
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Commit agreement record on a new branch
        if: steps.prepare.outputs.status == 'prepared'
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
          COMMIT_MESSAGE: ${{ steps.prepare.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add CLA_REGISTRY.yaml
          git commit --message "$COMMIT_MESSAGE"
          git push --set-upstream origin "$BRANCH"

      - name: Ensure agreement label exists
        if: steps.prepare.outputs.status == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh label create agreement
          --color 0E8A16
          --description "Records a reviewed contributor agreement"
          --force

      - name: Open Agreement PR
        if: steps.prepare.outputs.status == 'prepared'
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          PR_TITLE: ${{ steps.prepare.outputs.pr_title }}
          PR_BODY: ${{ steps.prepare.outputs.pr_body }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        run: |
          url=$(gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label agreement)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish Agreement PR exemption status
        if: steps.prepare.outputs.status == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          head_sha=$(git rev-parse HEAD)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state="success" \
            -f context="Contributor Agreement" \
            -f description="Generated Agreement PR is exempt from contributor agreement enforcement." \
            -f target_url="$PR_URL"

      - name: Link the signing issue to the Agreement PR
        if: steps.prepare.outputs.status == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.prepare.outputs.issue_number }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: >-
          gh issue comment "$ISSUE_NUMBER"
          --body "Agreement PR created: ${PR_URL}. This issue will close automatically when a maintainer merges that PR."
