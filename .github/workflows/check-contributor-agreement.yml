name: Contributor Agreement

# This workflow uses trusted code from the base repository and never checks out
# or executes the contributor's branch.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  verify:
    name: Evaluate contributor agreement
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Evaluate the pull request author
        id: evaluate
        env:
          CONTRIBUTOR_GITHUB_ID: ${{ github.event.pull_request.user.id }}
          PULL_REQUEST_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.repository.full_name }}
          PULL_REQUEST_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/evaluate-contributor-agreement.mjs

      - name: Publish required commit status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATE: ${{ steps.evaluate.outputs.state }}
          CONTEXT: ${{ steps.evaluate.outputs.context }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" \
            -f context="$CONTEXT" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"

      - name: Synchronize signing instructions
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          CONTRIBUTOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}
          AGREEMENT_STATE: ${{ steps.evaluate.outputs.state }}
        run: node scripts/manage-contributor-agreement-comment.mjs
